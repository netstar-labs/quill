name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# The token needs to read the repository and nothing else.
permissions:
  contents: read

env:
  GOWORK: "off"
  GOPRIVATE: github.com/netstar-labs

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: cross-vet the other supported platform
        run: GOOS=${{ matrix.os == 'ubuntu-latest' && 'darwin' || 'linux' }} go vet ./...
      - name: an unsupported platform must not build
        run: "! GOOS=freebsd go build ./..."
      - name: test (race)
        run: go test -race -count=1 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: every fuzz target for the gate's budget
        run: FUZZTIME=20s hack/fuzz.sh

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Pinned, not @latest: a check that can start failing with no change in the repo is
      # not a gate. The same pins are in hack/gate.sh; bump them together.
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      # deadcode exits 0 even when it finds something; only an empty report passes.
      - run: test -z "$(go run golang.org/x/tools/cmd/deadcode@v0.52.0 -test ./...)"
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: no module dependencies, ever
        run: "! grep -q '^require' go.mod"
      # Reachable standard-library vulnerabilities fail the job. The Go patch level comes
      # from go.mod's toolchain line; raise it when this reports a fix.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # T14: a full disk, for real, on a small tmpfs. Not part of the default gate.
  fulldisk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: mount a 4 MiB tmpfs
        run: sudo mkdir -p /mnt/quill-small && sudo mount -t tmpfs -o size=4m tmpfs /mnt/quill-small && sudo chmod 1777 /mnt/quill-small
      - name: fill it
        run: QUILL_FULLDISK_DIR=/mnt/quill-small go test -run FullDisk -count=1 -v .

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go run ./examples/log && go run ./examples/topics
      - run: go test -count=1 ./examples/...
      - name: the release build script runs
        run: build/quill --dev && test -s build/install/SHA256SUMS

  # The one check name the branch-protection ruleset requires. `if: always()` keeps it
  # from being skipped (a skipped required check counts as passed) when a job fails, and
  # it fails unless every job succeeded.
  ci:
    needs: [test, fuzz, static, fulldisk, examples]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$(printf '%s\n' $RESULTS | sort -u)" = success
